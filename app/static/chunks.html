<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>知识库分块浏览</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --border:#e4e7ec; --text:#1f2937; --muted:#6b7280; --brand:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--text); }
  header { background:var(--panel); border-bottom:1px solid var(--border); padding:16px 24px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); }
  .wrap { display:flex; gap:16px; padding:16px 24px; align-items:flex-start; }
  aside { width:300px; background:var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:12px; position:sticky; top:16px; max-height:calc(100vh - 60px); overflow:auto; }
  .doc { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px; line-height:1.5; }
  .doc:hover { background:#eff4ff; }
  .doc.active { background:#eff4ff; color:var(--brand); font-weight:600; }
  .doc small { display:block; color:var(--muted); font-size:11px; font-weight:400; }
  main { flex:1; min-width:0; }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:12px; font-size:13px; color:var(--muted); }
  .bar button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--border);
                background:#fff; cursor:pointer; }
  .bar button:disabled { opacity:.45; cursor:not-allowed; }
  .chunk { background:var(--panel); border:1px solid var(--border); border-radius:10px;
           padding:12px 14px; margin-bottom:10px; }
  .chunk .head { font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; gap:10px; }
  .chunk .tag { background:#eff4ff; color:var(--brand); padding:1px 7px; border-radius:999px; }
  .chunk .text { font-size:13.5px; line-height:1.85; white-space:pre-wrap; word-break:break-word; }
  .empty { color:var(--muted); font-size:13px; padding:30px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>知识库分块浏览</h1>
  <div class="sub">左边选文档，右边按顺序列出每个 chunk 的原文——每个块开头就是它的章节标题</div>
</header>

<div class="wrap">
  <aside id="docs"><div class="empty">加载中…</div></aside>
  <main>
    <div class="bar">
      <span id="info">请选择左侧文档</span>
      <span style="flex:1"></span>
      <button id="prev" disabled>上一页</button>
      <button id="next" disabled>下一页</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<script>
const PAGE = 10;
let docs = [], current = null, offset = 0, total = 0;

const el = (id) => document.getElementById(id);

async function loadDocs() {
  const res = await fetch('/api/documents');
  const data = await res.json();
  docs = data.items || [];
  const box = el('docs');
  if (!docs.length) { box.innerHTML = '<div class="empty">知识库为空，先去上传文档</div>'; return; }
  box.innerHTML = docs.map((d, i) =>
    `<div class="doc" data-i="${i}">${d.doc_name}<small>${d.chunks} 块 · ${d.doc_id.split('-').pop()}</small></div>`
  ).join('');
  box.querySelectorAll('.doc').forEach(node => {
    node.onclick = () => openDoc(Number(node.dataset.i));
  });
  openDoc(0);
}

async function openDoc(index) {
  current = docs[index];
  offset = 0;
  document.querySelectorAll('.doc').forEach((n, i) => n.classList.toggle('active', i === index));
  await loadChunks();
}

async function loadChunks() {
  const shortId = current.doc_id.split('-').pop();
  el('list').innerHTML = '<div class="empty">加载分块…</div>';
  const res = await fetch(`/api/documents/${shortId}/chunks?offset=${offset}&limit=${PAGE}`);
  if (!res.ok) { el('list').innerHTML = '<div class="empty">加载失败</div>'; return; }
  const data = await res.json();
  total = data.total;

  el('list').innerHTML = data.items.map(c => `
    <div class="chunk">
      <div class="head">
        <span class="tag">#${c.chunk_index}</span>
        <span>第 ${c.page} 页</span>
        <span>${c.chars} 字</span>
      </div>
      <div class="text">${escapeHtml(c.text)}</div>
    </div>`).join('');

  el('info').textContent = `${current.doc_name} · 共 ${total} 块 · 当前 ${offset + 1}–${Math.min(offset + PAGE, total)}`;
  el('prev').disabled = offset === 0;
  el('next').disabled = offset + PAGE >= total;
}

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

el('prev').onclick = () => { offset = Math.max(0, offset - PAGE); loadChunks(); };
el('next').onclick = () => { offset += PAGE; loadChunks(); };
loadDocs();
</script>
</body>
</html>
